input {
  beats {
    port => 5044
  }
}

filter {
  # Add basic log source identification
  if [log][file][path] =~ "auth.log" {
    mutate { add_field => { "log_source" => "linux_auth" } }
  }
  if [log][file][path] =~ "apache" {
    mutate { add_field => { "log_source" => "apache" } }
  }
  if [log][file][path] =~ "windows-sim" {
    mutate { add_field => { "log_source" => "windows_sim" } }
  }
  
  # Suricata EVE JSON log processing
  if [log][file][path] =~ "suricata" {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
    # If using newer Filebeat versions, raw JSON might be in [event][original]
    if ![event_type] {
      json {
        source => "[event][original]"
        skip_on_invalid_json => true
      }
    }
    mutate { 
      add_field => { "log_source" => "suricata_ids" }
      add_field => { "detection_engine" => "suricata" }
    }
    
    # Process alerts
    if [event_type] == "alert" {
      # Map severity to level
      if [alert][severity] == 1 {
        mutate { add_field => { "severity_level" => "critical" } }
      } else if [alert][severity] == 2 {
        mutate { add_field => { "severity_level" => "high" } }
      } else if [alert][severity] == 3 {
        mutate { add_field => { "severity_level" => "medium" } }
      } else {
        mutate { add_field => { "severity_level" => "low" } }
      }
    }
    
    # GeoIP enrichment disabled for minimal mode to save memory (OOM prevention)
    #if [src_ip] and [src_ip] !~ "^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)" {
    #  geoip {
    #    source => "src_ip"
    #    target => "src_geo"
    #  }
    #}
    
    #if [dest_ip] and [dest_ip] !~ "^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)" {
    #  geoip {
    #    source => "dest_ip"
    #    target => "dest_geo"
    #  }
    #}
    
    # Add network direction indicator
    if [src_ip] =~ "^172\.20\." {
      mutate { add_field => { "traffic_direction" => "outbound" } }
    } else if [dest_ip] =~ "^172\.20\." {
      mutate { add_field => { "traffic_direction" => "inbound" } }
    } else {
      mutate { add_field => { "traffic_direction" => "external" } }
    }
    
    # Identify internal hosts
    if [src_ip] == "172.20.0.50" {
      mutate { add_field => { "src_host" => "ubuntu-web" } }
    } else if [src_ip] == "172.20.0.70" {
      mutate { add_field => { "src_host" => "kali-attacker" } }
    }
    
    if [dest_ip] == "172.20.0.50" {
      mutate { add_field => { "dest_host" => "ubuntu-web" } }
    } else if [dest_ip] == "172.20.0.70" {
      mutate { add_field => { "dest_host" => "kali-attacker" } }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://172.20.0.10:9200"]
    user => "elastic"
    password => "changeme"
    index => "soc-logs-%{+YYYY.MM.dd}"
  }
}
